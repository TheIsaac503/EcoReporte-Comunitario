{% extends 'reportes/base.html' %}
{% block title %}{{ titulo }} | EcoReporte{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width:700px"><div class="card-body p-4">
<h1 class="h3 text-success mb-4">{{ titulo }}</h1>
<form method="post">{% csrf_token %}
{% for campo in formulario %}<div class="mb-3">
<label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
{{ campo }}{% for error in campo.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
</div>{% endfor %}
<button class="btn btn-success" type="submit">Guardar</button>
<a class="btn btn-outline-secondary" href="{% url 'listar_categorias' %}">Cancelar</a>
</form></div></div>
{% endblock %}
