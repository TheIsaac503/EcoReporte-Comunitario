{% extends 'reportes/base.html' %}
{% block title %}Confirmar eliminación | EcoReporte{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width:620px">
 <div class="card-body p-4">
  <h1 class="h4 text-danger">Confirmar eliminación</h1>
  <p>¿Estás seguro de que deseas eliminar {{ tipo }} <strong>{{ objeto }}</strong>?</p>
  <p class="text-muted small">Esta acción no se puede deshacer.</p>
  <form method="post">{% csrf_token %}
   <button class="btn btn-danger" type="submit">Sí, eliminar</button>
   <a class="btn btn-outline-secondary" href="{% if tipo == 'reporte' %}{% url 'listar_reportes' %}{% else %}{% url 'listar_categorias' %}{% endif %}">Cancelar</a>
  </form>
 </div>
</div>
{% endblock %}
