<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Reporte Ambiental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Registrar reporte ambiental</h3>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            Por favor corrige los errores antes de enviar.
                            {{ form.errors }}
                        </div>
                    {% endif %}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-success w-100 mt-3">Guardar Reporte</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
